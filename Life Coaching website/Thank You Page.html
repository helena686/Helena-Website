<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Helena Menadue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root {
  --plum-900:#1f1322;--plum-800:#2c1a32;--plum-700:#3d2645;--plum-600:#5a3866;
  --cream-50:#fbf6ee;--cream-100:#f5ecde;--cream-200:#ece0cc;
  --ink-900:#2a1d2e;--ink-700:#4a3a4f;--ink-500:#7a6a7e;
  --rose-300:#e8b4a8;--rose-500:#c97863;
  --gold-400:#e8b86a;--gold-500:#d4a04a;--gold-600:#b8842f;
  --surface:#fff;--border:#e8ddca;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Outfit',system-ui,sans-serif;
  --shadow-sm:0 1px 2px rgba(31,19,34,.06),0 1px 3px rgba(31,19,34,.04);
  --shadow-md:0 4px 12px rgba(31,19,34,.08),0 2px 4px rgba(31,19,34,.04);
  --shadow-lg:0 12px 32px rgba(31,19,34,.12),0 4px 8px rgba(31,19,34,.06);
  --shadow-glow:0 0 0 1px rgba(212,160,74,.3),0 12px 40px rgba(212,160,74,.25);
  --radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;--radius-pill:999px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--cream-50);color:var(--ink-900);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
p{text-wrap:pretty}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* ── NAV (logo only) ── */
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;
  background:rgba(31,19,34,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:var(--radius-pill);padding:11px 28px;
  border:1px solid rgba(232,184,106,.15);box-shadow:var(--shadow-lg)}
.nav-logo{font-family:var(--font-display);font-size:17px;font-weight:500;color:var(--cream-50);white-space:nowrap}
.nav-logo em{font-style:italic;color:var(--gold-400)}

/* ── Shared ── */
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-family:var(--font-body)}
.eyebrow--amber{color:var(--gold-600)}
.eyebrow--gold{color:var(--gold-400)}
.grad-text{background:linear-gradient(120deg,var(--gold-600),var(--rose-500),var(--gold-500));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.grad-text--warm{background:linear-gradient(120deg,var(--gold-600),var(--rose-500));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── HERO ── */
.hero{background:var(--plum-900);padding:148px 24px 88px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.hero h1{font-size:clamp(32px,6vw,60px);font-weight:400;color:var(--cream-50);margin-bottom:18px;letter-spacing:-.03em;line-height:1.08;max-width:820px}
.hero-sub{font-size:17px;line-height:1.65;color:rgba(251,246,238,.82);max-width:640px;margin-bottom:10px}
.hero-sub2{font-size:15px;line-height:1.65;color:rgba(251,246,238,.5);max-width:560px;margin-bottom:44px}
.hero-inner{position:relative;z-index:1;max-width:820px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;
  background:rgba(255,255,255,.05);border:1px solid rgba(232,184,106,.25);
  border-radius:var(--radius-pill);font-size:12.5px;letter-spacing:.06em;color:var(--gold-400);margin-bottom:28px}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--gold-500);box-shadow:0 0 8px var(--gold-400);animation:pulse 2.4s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* Video */
.video-wrap{border-radius:var(--radius-xl);background:var(--plum-800);
  border:1px solid rgba(232,184,106,.14);box-shadow:0 24px 60px rgba(0,0,0,.45);
  aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.video-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
.play-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.play-ring{position:absolute;width:96px;height:96px;border-radius:50%;background:var(--gold-400);opacity:.1;animation:ripple 2.4s ease-out infinite}
@keyframes ripple{0%{transform:scale(.8);opacity:.18}100%{transform:scale(1.6);opacity:0}}
.play-btn{position:relative;width:72px;height:72px;border-radius:50%;background:var(--gold-500);
  display:flex;align-items:center;justify-content:center;padding-left:4px;
  box-shadow:var(--shadow-glow);transition:transform .2s,background .2s;border:none;cursor:pointer}
.play-btn:hover{transform:scale(1.07);background:var(--gold-400)}
.video-label{font-size:12px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:rgba(251,246,238,.35)}

/* ── BEFORE WE TALK ── */
.before{background:var(--cream-50);padding:88px 24px}
.before-inner{max-width:760px;margin:0 auto}
.before-header{text-align:center;margin-bottom:44px}
.before-header h2{font-size:clamp(26px,4.5vw,44px);color:var(--ink-900);margin-top:12px}
.call-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.call-grid{grid-template-columns:1fr}}
.call-card{display:flex;gap:18px;align-items:flex-start;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);
  padding:28px 24px;transition:transform .3s,border-color .3s,box-shadow .3s}
.call-card:hover{transform:translateY(-3px);border-color:rgba(212,160,74,.4);box-shadow:var(--shadow-md)}
.call-icon{width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-400),var(--rose-300));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--plum-900);margin-top:2px}
.call-card h3{font-family:var(--font-display);font-size:17px;font-weight:500;letter-spacing:-.01em;
  color:var(--ink-900);margin-bottom:6px;line-height:1.25}
.call-card p{font-size:14.5px;line-height:1.6;color:var(--ink-700)}

/* ── TRANSFORMATIONS ── */
.stories{background:var(--plum-900);padding:88px 24px}
.stories-inner{max-width:1100px;margin:0 auto}
.stories-header{text-align:center;margin-bottom:44px}
.stories-header h2{font-size:clamp(26px,5vw,44px);color:var(--gold-400);margin-top:10px}
.stories-header h2 em{font-style:italic;color:var(--cream-50)}
.stories-header p{color:rgba(251,246,238,.65);font-size:16px;max-width:400px;margin:12px auto 0;line-height:1.6}
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:720px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}
.gallery-item{aspect-ratio:3/4;border-radius:var(--radius-md);overflow:hidden;display:flex;cursor:default;transition:transform .3s}
.gallery-item:hover{transform:scale(1.02)}
.g-half{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px}
.g-half span{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.g-rose-l{background:linear-gradient(160deg,#e8b4a8,rgba(232,180,168,.35))}
.g-rose-d{background:linear-gradient(160deg,#e8b4a8,#c97863)}
.g-gold-l{background:linear-gradient(160deg,#e8b86a,rgba(232,184,106,.35))}
.g-gold-d{background:linear-gradient(160deg,#e8b86a,#b8842f)}
.g-plum-l{background:linear-gradient(160deg,#5a3866,rgba(90,56,102,.35))}
.g-plum-d{background:linear-gradient(160deg,#5a3866,#1f1322)}

/* ── FAQ ── */
.faq{background:var(--cream-50);padding:88px 24px}
.faq-inner{max-width:680px;margin:0 auto}
.faq-header{text-align:center;margin-bottom:44px}
.faq-header h2{font-size:clamp(24px,4vw,40px);color:var(--ink-900);margin-top:12px}
.faq-list{display:flex;flex-direction:column;gap:12px}
.faq-item{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.faq-item.open{border-color:var(--gold-500);box-shadow:var(--shadow-sm)}
.faq-q{width:100%;display:flex;align-items:center;gap:16px;padding:20px 24px;text-align:left;cursor:pointer}
.faq-num{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--cream-100);
  border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;color:var(--gold-600);transition:background .2s,border-color .2s,color .2s}
.faq-item.open .faq-num{background:var(--gold-400);border-color:var(--gold-500);color:var(--plum-900)}
.faq-q-text{flex:1}
.faq-q-text strong{display:block;font-size:15.5px;font-weight:600;color:var(--ink-900);margin-bottom:3px}
.faq-q-text small{font-size:13px;color:var(--ink-500)}
.faq-chevron{flex-shrink:0;color:var(--ink-500);transition:transform .3s,color .2s}
.faq-item.open .faq-chevron{transform:rotate(180deg);color:var(--gold-600)}
.faq-answer{max-height:0;overflow:hidden;transition:max-height .38s ease}
.faq-item.open .faq-answer{max-height:400px}
.faq-answer-inner{padding:0 24px 22px 72px;font-size:15px;color:var(--ink-700);line-height:1.65}
@media(max-width:520px){.faq-answer-inner{padding-left:24px}}

/* ── FOOTER (minimal) ── */
.footer{background:var(--plum-900);padding:40px 24px 28px}
.footer-inner{max-width:760px;margin:0 auto}
.footer-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:16px;padding-bottom:20px;border-bottom:1px solid rgba(251,246,238,.08);margin-bottom:20px}
.footer-logo{font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--cream-50)}
.footer-logo em{font-style:italic;color:var(--gold-400)}
.footer-links{display:flex;gap:24px}
.footer-links a{font-size:13px;color:rgba(251,246,238,.5);transition:color .2s}
.footer-links a:hover{color:var(--gold-400)}
.footer-bottom{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.footer-copy{font-size:12px;color:rgba(251,246,238,.35)}
.footer-legal{display:flex;gap:20px}
.footer-legal a{font-size:12px;color:rgba(251,246,238,.35);transition:color .2s}
.footer-legal a:hover{color:rgba(251,246,238,.6)}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

const FAQ_ITEMS = [
  {
    q: "What if I can't talk about it?",
    sub: "You don't have to",
    a: "You don't have to relive it to release it. We don't need to go over the story again and again. We work with the nervous system and the subconscious — which means we can shift things without you having to narrate every detail. Many women find that a relief.",
  },
  {
    q: 'What if I am still in the relationship?',
    sub: "You don't need to have left",
    a: "You don't need to have left. Some of the most powerful work happens with women still inside it, getting clear, regulating their nervous systems, and making the decisions that are right for them, in their own time. You're not here to be told what to do. You're here to come back to your own knowing.",
  },
];

const GALLERY = [
  {l:'g-rose-l',d:'g-rose-d'},{l:'g-gold-l',d:'g-gold-d'},
  {l:'g-plum-l',d:'g-plum-d'},{l:'g-rose-l',d:'g-rose-d'},
  {l:'g-gold-l',d:'g-gold-d'},{l:'g-plum-l',d:'g-plum-d'},
  {l:'g-rose-l',d:'g-rose-d'},{l:'g-gold-l',d:'g-gold-d'},
];

/* Icons */
const ClockIcon = () => <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>;
const ChatIcon  = () => <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
const CompassIcon = () => <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>;
const LeafIcon  = () => <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 9-9h6v6c0 5-4 9-9 9z"/><path d="M4 20c4-3 6-7 8-12"/></svg>;
const ChevronDown = () => <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>;

const CALL_POINTS = [
  { icon: <ClockIcon/>,   heading: '30 minutes, just you and me.', body: 'A real conversation, not a pitch. There is no script and nothing to prepare.' },
  { icon: <ChatIcon/>,    heading: "We'll talk about what's weighing on you.", body: "What you have been carrying, what you want different, and how long you have felt this way." },
  { icon: <CompassIcon/>, heading: "I'll share how I work.", body: "And whether it is the right fit for where you are now. Honesty over everything." },
  { icon: <LeafIcon/>,    heading: 'No pressure either way.', body: "If it's not right, we both know. That's a good outcome too." },
];

/* NAV */
function Nav() {
  return (
    <header className="nav">
      <span className="nav-logo">Helena <em>Menadue</em></span>
    </header>
  );
}

/* HERO */
function Hero() {
  return (
    <section className="hero">
      <div className="blob" style={{background:'#d4a04a',width:440,height:440,top:-120,right:-80,opacity:.07}}/>
      <div className="blob" style={{background:'#c97863',width:380,height:380,bottom:-100,left:-60,opacity:.07}}/>
      <div className="hero-inner">
        <div className="hero-badge"><span className="badge-dot"/><span>Your call is confirmed</span></div>
        <h1>Thank you for booking <em className="grad-text">a call with Helena.</em></h1>
        <p className="hero-sub">We are thrilled to have the opportunity to work through this with you — helping you heal at the root, rediscover who you are, and come home to yourself for the last time.</p>
        <p className="hero-sub2">If you have any questions before our call, please don't hesitate to reach out. Looking forward to speaking with you.</p>
        <div className="video-wrap">
          <div className="video-inner">
            <div className="play-wrap">
              <span className="play-ring"/>
              <button className="play-btn" aria-label="Play video message from Helena">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="#1f1322"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>
            <span className="video-label">A message from Helena</span>
          </div>
        </div>
      </div>
    </section>
  );
}

/* BEFORE WE TALK */
function BeforeWeTalk() {
  return (
    <section className="before">
      <div className="before-inner">
        <div className="before-header">
          <p className="eyebrow eyebrow--amber">Before We Talk</p>
          <h2>Here's what our call <em className="grad-text--warm">will look like.</em></h2>
        </div>
        <div className="call-grid">
          {CALL_POINTS.map((pt, i) => (
            <div className="call-card" key={i}>
              <div className="call-icon">{pt.icon}</div>
              <div>
                <h3>{pt.heading}</h3>
                <p>{pt.body}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* TRANSFORMATIONS */
function Transformations() {
  return (
    <section className="stories">
      <div className="stories-inner">
        <div className="stories-header">
          <p className="eyebrow eyebrow--gold">Real Stories</p>
          <h2>Women, <em>transformed</em></h2>
          <p>The women who walked through this didn't become someone new. They came back to who they always were.</p>
        </div>
        <div className="gallery-grid">
          {GALLERY.map((g,i) => (
            <div className="gallery-item" key={i}>
              <div className={`g-half ${g.l}`}><span>Before</span></div>
              <div className={`g-half ${g.d}`}><span>After</span></div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* FAQ */
function FAQ() {
  const [openIdx, setOpenIdx] = useState(0);
  const toggle = i => setOpenIdx(prev => prev === i ? -1 : i);
  return (
    <section className="faq">
      <div className="faq-inner">
        <div className="faq-header">
          <p className="eyebrow eyebrow--amber">In Case You're Wondering</p>
          <h2>A couple of things people often ask <em className="grad-text--warm">once they've booked.</em></h2>
        </div>
        <div className="faq-list">
          {FAQ_ITEMS.map((item, i) => {
            const isOpen = openIdx === i;
            return (
              <div className={`faq-item${isOpen ? ' open' : ''}`} key={i}>
                <button className="faq-q" onClick={() => toggle(i)} aria-expanded={isOpen}>
                  <span className="faq-num">{String(i+1).padStart(2,'0')}</span>
                  <span className="faq-q-text">
                    <strong>{item.q}</strong>
                    <small>{item.sub}</small>
                  </span>
                  <span className="faq-chevron"><ChevronDown/></span>
                </button>
                <div className="faq-answer">
                  <div className="faq-answer-inner">{item.a}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );
}

/* FOOTER */
function Footer() {
  return (
    <footer className="footer">
      <div className="footer-inner">
        <div className="footer-top">
          <span className="footer-logo">Helena <em>Menadue</em></span>
          <div className="footer-links">
            <a href="mailto:hello@helenamenadue.com">hello@helenamenadue.com</a>
            <a href="#">Instagram</a>
          </div>
        </div>
        <div className="footer-bottom">
          <span className="footer-copy">© 2026 Helena Menadue</span>
          <div className="footer-legal">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
          </div>
        </div>
      </div>
    </footer>
  );
}

/* APP */
function App() {
  return (
    <>
      <Nav/>
      <Hero/>
      <BeforeWeTalk/>
      <Transformations/>
      <FAQ/>
      <Footer/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
